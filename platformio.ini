; TapeDeck - web label printing for a Brother P-touch (PT-D600) on an
; M5Stack Core Basic + USB Module (MAX3421E).
; lib/M5-Max3421E-USBShield is M5Stack's TinyUSB fork (MIT), vendored with a
; MAX3421E OUT-NAK fix in hcd_max3421.c (see TAPEDECK patch comments).
; Toolchain as in UPS Watcher: pioarduino 55.03.312-1 = Arduino core 3.3.12.

[platformio]
default_envs = app

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-core-esp32-16M
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.27
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DTAPEDECK_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
    -DCFG_TUH_API_EDPT_XFER=1
    -I${PROJECT_DIR}/include

; Hardware probe: descriptors, status, test prints over the serial console.
[env:probe]
extends = common
build_src_filter = +<probe/> +<common/> +<usb/>
build_flags =
    ${common.build_flags}
    -DCFG_TUSB_DEBUG=0

[env:app]
extends = common
build_src_filter = +<app/> +<common/> +<usb/>

; Host-side unit tests for the plain C++ modules: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -I${PROJECT_DIR}/include
test_build_src = yes
build_src_filter = +<common/>
